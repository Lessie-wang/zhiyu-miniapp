<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知愈情绪卡片测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(to bottom, #FAF9F7 0%, #F2E6DF 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #6D6A65;
      margin-bottom: 40px;
      font-size: 32px;
    }

    .emotion-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 40px;
    }

    .emotion-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 8px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(212, 184, 165, 0.12);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      min-height: 140px;
      overflow: hidden;
      cursor: pointer;
    }

    .emotion-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(212, 184, 165, 0.2);
    }

    .emotion-card.selected {
      box-shadow: 0 12px 32px rgba(212, 184, 165, 0.3);
      transform: scale(1.05);
    }

    .emotion-icon {
      width: 56px;
      height: 56px;
      margin-bottom: 12px;
      object-fit: contain;
    }

    .emotion-name {
      font-size: 14px;
      color: #6D6A65;
      font-weight: 600;
      text-align: center;
    }

    .emotion-card.selected .emotion-name {
      color: white;
    }

    .check-mark {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #D4B8A5;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .emotion-card.selected .check-mark {
      opacity: 1;
    }

    .info {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(212, 184, 165, 0.1);
      margin-top: 20px;
    }

    .info h2 {
      color: #6D6A65;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .info p {
      color: #B8B2A7;
      line-height: 1.6;
    }

    .selected-list {
      color: #D4B8A5;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>知愈情绪卡片 - 水彩图标版</h1>

    <div class="emotion-grid" id="emotionGrid"></div>

    <div class="info">
      <h2>已选择的情绪：</h2>
      <p class="selected-list" id="selectedList">未选择</p>
    </div>

    <div class="info">
      <h2>测试说明：</h2>
      <p>
        ✅ 点击卡片选择/取消情绪<br>
        ✅ 选中时显示对应颜色的渐变背景<br>
        ✅ 悬停时卡片上浮效果<br>
        ✅ 使用AI生成的水彩风格图标<br>
        ✅ 平滑的动画过渡效果
      </p>
    </div>
  </div>

  <script>
    const emotions = [
      { name: '开心', iconType: 'happy', color: '#F5C6CB' },
      { name: '平静', iconType: 'calm', color: '#B8D4E8' },
      { name: '难过', iconType: 'sad', color: '#9BA8BC' },
      { name: '累', iconType: 'tired', color: '#D4C5B0' },
      { name: '烦躁', iconType: 'irritated', color: '#E8A5A5' },
      { name: '焦虑', iconType: 'anxious', color: '#C4B5D8' },
      { name: '愤怒', iconType: 'angry', color: '#D89B9B' },
      { name: '感动', iconType: 'touched', color: '#F5D4C4' },
      { name: '困惑', iconType: 'confused', color: '#C4D4B5' },
      { name: '无聊', iconType: 'bored', color: '#D0CFC4' },
      { name: '震惊', iconType: 'shocked', color: '#E8C4D8' },
      { name: '不知道', iconType: 'unknown', color: '#BCBCBC' }
    ];

    const selectedEmotions = new Set();
    const grid = document.getElementById('emotionGrid');
    const selectedList = document.getElementById('selectedList');

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function renderCards() {
      grid.innerHTML = '';
      emotions.forEach(emotion => {
        const card = document.createElement('div');
        card.className = 'emotion-card';

        const isSelected = selectedEmotions.has(emotion.name);
        if (isSelected) {
          card.classList.add('selected');
          card.style.background = emotion.color;
        } else {
          const color1 = hexToRgba(emotion.color, 0.15);
          const color2 = hexToRgba(emotion.color, 0.08);
          card.style.background = `linear-gradient(135deg, ${color1}, ${color2})`;
        }

        card.innerHTML = `
          <img class="emotion-icon" src="images/emotion-icons/${emotion.iconType}.png" alt="${emotion.name}">
          <div class="emotion-name">${emotion.name}</div>
          <div class="check-mark">✓</div>
        `;

        card.addEventListener('click', () => {
          if (selectedEmotions.has(emotion.name)) {
            selectedEmotions.delete(emotion.name);
          } else {
            selectedEmotions.add(emotion.name);
          }
          renderCards();
          updateSelectedList();
        });

        grid.appendChild(card);
      });
    }

    function updateSelectedList() {
      if (selectedEmotions.size === 0) {
        selectedList.textContent = '未选择';
      } else {
        selectedList.textContent = Array.from(selectedEmotions).join('、');
      }
    }

    renderCards();
  </script>
</body>
</html>
